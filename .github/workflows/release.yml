name: Release Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Publish Release Assets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache Setup
        uses: Swatinem/rust-cache@v2

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build Release Binaries
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Package Release Assets (.tar.gz & .sha256)
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          ARCHIVE_NAME="skipper360-${TAG_NAME}-${{ matrix.target }}"
          
          mkdir -p "${ARCHIVE_NAME}"
          cp "target/${{ matrix.target }}/release/skipper" "${ARCHIVE_NAME}/"
          cp "target/${{ matrix.target }}/release/skipperd" "${ARCHIVE_NAME}/"
          cp "install.sh" "${ARCHIVE_NAME}/"
          cp -r "systemd" "${ARCHIVE_NAME}/"
          cp -r "man" "${ARCHIVE_NAME}/"
          cp -r "scripts" "${ARCHIVE_NAME}/"
          cp "README.md" "${ARCHIVE_NAME}/"
          cp "LICENSE-MIT" "${ARCHIVE_NAME}/"
          cp "LICENSE-APACHE" "${ARCHIVE_NAME}/"
          
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            skipper360-*.tar.gz
            skipper360-*.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
