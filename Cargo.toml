[workspace]
resolver = "2"
members = [
    "crates/skipper-cli",
    "crates/skipperd",
    "crates/skipper-core",
]

[workspace.dependencies]
# Serialization & Config
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async & Runtime
tokio = { version = "1.38", features = ["full"] }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = "0.11"
owo-colors = "4.0"
indicatif = "0.18"

# PTY
portable-pty = "0.9"

# Security & Credentials
keyring = "3.0"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1.8", features = ["derive"] }

# System & OS
nix = { version = "0.31", features = ["process", "signal", "term", "fs", "mman"] }
dirs = "6.0"

# Patterns & Regex
regex = "1.10"

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
